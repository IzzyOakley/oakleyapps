runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── Firebase client config (public — safe to hardcode) ────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: oakley-apps
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: oakley-apps.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: oakley-apps.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "504450312463"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:504450312463:web:5c6e0c460981abe144b67a
    availability:
      - BUILD
      - RUNTIME

  # Firebase API key — public by design, hardcoded to avoid build-time secret resolution
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDG5GGwWDLpDudljSlf2E4qKG0uY38nF8w
    availability:
      - BUILD
      - RUNTIME

  # ── Force pnpm version for Google buildpack ────────────────────────────────
  - variable: GOOGLE_PNPM_VERSION
    value: "9.15.9"
    availability:
      - BUILD

  # ── Firebase Admin (server-side only) ─────────────────────────────────────
  # Uses Application Default Credentials on GCP — no private key needed here.
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: oakley-apps
    availability:
      - RUNTIME

  # ── Internal service shared secret ────────────────────────────────────────
  # NOTE: Temporarily hardcoded for diagnostic build — restore secrets after confirmed working
  - variable: INTERNAL_SERVICE_SECRET
    value: oakley-internal-prod-2024
    availability:
      - RUNTIME

  # ── Backend service URLs ───────────────────────────────────────────────────
  - variable: TAKEOFF_AGENT_URL
    value: https://takeoff-agent-504450312463.us-central1.run.app
    availability:
      - RUNTIME

  - variable: BID_GENERATOR_URL
    value: https://bid-generator-504450312463.us-central1.run.app
    availability:
      - RUNTIME
