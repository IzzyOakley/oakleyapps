name: Web — CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'shared/**'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'shared/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web run type-check

      - name: Lint
        run: pnpm --filter web run lint

      - name: Build
        run: pnpm --filter web run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: oakley-apps
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: oakley-apps.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: oakley-apps.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "504450312463"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:504450312463:web:5c6e0c460981abe144b67a
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDG5GGwWDLpDudljSlf2E4qKG0uY38nF8w
          FIREBASE_ADMIN_PROJECT_ID: oakley-apps
