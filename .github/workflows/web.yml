name: Web — CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'shared/**'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'shared/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web run type-check

      - name: Lint
        run: pnpm --filter web run lint

      - name: Build
        run: pnpm --filter web run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: oakley-apps
          FIREBASE_ADMIN_PROJECT_ID: oakley-apps

  deploy:
    name: Deploy to Firebase App Hosting
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Firebase App Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          channelId: live
          projectId: oakley-apps
          entryPoint: apps/web
